# Paste these locations INSIDE the existing site's server block.
# Keep its root, server_name, TLS certificate and ACME challenge settings.
# Replace existing overlapping locations; do not append duplicate location /.
# The root must contain the CONTENTS of dist/.

index index.html;

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /app-release.apk {
    try_files $uri =404;
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="app-release.apk"';
    add_header Cache-Control "no-cache";
}
