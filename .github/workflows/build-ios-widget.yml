name: Build iOS PoemWidget (.appex)

on:
  workflow_dispatch:
    inputs:
      sign_mode:
        description: "Build mode: signed (requires Apple Secrets) or unsigned (compile check / HBuilderX re-sign)"
        required: true
        default: "signed"
        type: choice
        options:
          - signed
          - unsigned

jobs:
  build-ios-widget:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Xcode & version info
        run: |
          xcodebuild -version
          VERSION=$(node -p 'require("./manifest.json").versionName')
          BUILD=$(node -p 'require("./manifest.json").versionCode')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Building PoemWidget for version $VERSION ($BUILD), mode=${{ inputs.sign_mode }}"

      - name: Prepare & verify Huiwen-mincho.ttf for WidgetKit
        run: |
          set -euo pipefail
          python3 -m pip install --quiet fonttools brotli
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          font = TTFont("static/fonts/Huiwen-mincho-compressed.woff2")
          font.flavor = None
          font.save("native/ios/PoemWidget/Huiwen-mincho.ttf")
          PY
          ls -lh "native/ios/PoemWidget/Huiwen-mincho.ttf"
          swift - <<'SWIFT'
          import CoreText
          import Foundation
          let url = URL(fileURLWithPath: "native/ios/PoemWidget/Huiwen-mincho.ttf") as CFURL
          var err: Unmanaged<CFError>?
          guard CTFontManagerRegisterFontsForURL(url, .process, &err) else {
              fatalError("CoreText register failed: \(String(describing: err))")
          }
          let font = CTFontCreateWithName("Huiwen-mincho" as CFString, 20, nil)
          let psName = CTFontCopyPostScriptName(font) as String
          let chars = Array("做一个坏诗人，风翻过书页".utf16)
          var glyphs = [CGGlyph](repeating: 0, count: chars.count)
          let ok = CTFontGetGlyphsForCharacters(font, chars, &glyphs, chars.count)
          print("CoreText verified font=\(psName), hasAllGlyphs=\(ok), sampleGlyphs=\(glyphs.prefix(6))")
          guard psName == "Huiwen-mincho" && ok && !glyphs.contains(0) else {
              fatalError("Huiwen-mincho glyph verification failed")
          }
          SWIFT

      - name: Build signed PoemWidget.appex
        if: ${{ inputs.sign_mode == 'signed' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${IOS_P12_BASE64:-}" || -z "${IOS_P12_PASSWORD:-}" || -z "${IOS_WIDGET_PROFILE_BASE64:-}" ]]; then
            echo "::error::Missing required GitHub Secrets: IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_WIDGET_PROFILE_BASE64"
            exit 1
          fi

          WORK_DIR="$RUNNER_TEMP/ios-widget-signing"
          mkdir -p "$WORK_DIR"
          P12_PATH="$WORK_DIR/cert.p12"
          PROFILE_PATH="$WORK_DIR/PoemWidget.mobileprovision"
          PROFILE_PLIST="$WORK_DIR/profile.plist"
          KEYCHAIN_PATH="$WORK_DIR/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          printf '%s' "$IOS_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$P12_PATH"
          printf '%s' "$IOS_WIDGET_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILE_PATH"

          # Inspect provisioning profile
          security cms -D -i "$PROFILE_PATH" -o "$PROFILE_PLIST"
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          GROUP="group.com.poementer.app.widgets"
          BUNDLE_ID="com.poementer.app.PoemWidget"

          if [[ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]] || \
             ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$PROFILE_PLIST" | grep -Fqx "    $GROUP"; then
            echo "::error::Profile mismatch. Expected $TEAM_ID.$BUNDLE_ID with App Group $GROUP, got $APP_ID"
            exit 1
          fi

          # Install provisioning profile for both Xcode 15 and Xcode 16+
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Create temporary keychain and import .p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Detect exact signing identity from the imported .p12
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/1\)/{print $2; exit}')
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::No valid codesigning identity found in the imported .p12 certificate."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Using signing identity: $SIGN_IDENTITY"
          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

          BUILD_DIR="$RUNNER_TEMP/poem-widget-build"
          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -project "native/ios/PoemWidget/PoemWidget.xcodeproj" \
            -target PoemWidget \
            -configuration Release \
            -sdk iphoneos \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            OBJROOT="$BUILD_DIR/intermediates" \
            SYMROOT="$BUILD_DIR/products" \
            build

          test -f "$BUILD_DIR/PoemWidget.appex/Huiwen-mincho.ttf"
          test -f "$BUILD_DIR/PoemWidget.appex/poem-widget-icon.png"
          codesign --verify --strict --verbose=2 "$BUILD_DIR/PoemWidget.appex"

          STAGE_DIR="$RUNNER_TEMP/poem-widget-output"
          mkdir -p "$STAGE_DIR/uni_modules/poem-widget/utssdk/app-ios/Plugins"
          mkdir -p "$STAGE_DIR/nativeResources/ios"
          ditto "$BUILD_DIR/PoemWidget.appex" "$STAGE_DIR/uni_modules/poem-widget/utssdk/app-ios/Plugins/PoemWidget.appex"
          cp "$PROFILE_PATH" "$STAGE_DIR/nativeResources/ios/PoemWidget.mobileprovision"
          cp "native/ios/PoemWidget/PoemWidget.entitlements" "$STAGE_DIR/nativeResources/ios/UniApp.entitlements"
          cp "native/ios/PoemWidget/ios-extension.json" "$STAGE_DIR/nativeResources/ios/ios-extension.json"

          # Cleanup temporary keychain
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Build unsigned PoemWidget.appex
        if: ${{ inputs.sign_mode == 'unsigned' }}
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/poem-widget-build"
          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -project "native/ios/PoemWidget/PoemWidget.xcodeproj" \
            -target PoemWidget \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            OBJROOT="$BUILD_DIR/intermediates" \
            SYMROOT="$BUILD_DIR/products" \
            build

          test -f "$BUILD_DIR/PoemWidget.appex/Huiwen-mincho.ttf"
          test -f "$BUILD_DIR/PoemWidget.appex/poem-widget-icon.png"

          STAGE_DIR="$RUNNER_TEMP/poem-widget-output"
          mkdir -p "$STAGE_DIR/uni_modules/poem-widget/utssdk/app-ios/Plugins"
          mkdir -p "$STAGE_DIR/nativeResources/ios"
          ditto "$BUILD_DIR/PoemWidget.appex" "$STAGE_DIR/uni_modules/poem-widget/utssdk/app-ios/Plugins/PoemWidget.appex"
          cp "native/ios/PoemWidget/PoemWidget.entitlements" "$STAGE_DIR/nativeResources/ios/UniApp.entitlements"
          cp "native/ios/PoemWidget/ios-extension.json" "$STAGE_DIR/nativeResources/ios/ios-extension.json"

      - name: Upload PoemWidget.appex artifact
        uses: actions/upload-artifact@v4
        with:
          name: poem-widget-ios-${{ inputs.sign_mode }}-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}
          path: ${{ runner.temp }}/poem-widget-output/
          if-no-files-found: error
          retention-days: 30
