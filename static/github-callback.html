<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 登录回调</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 16px;
            margin-top: 1rem;
        }
        .fallback {
            margin-top: 2rem;
            font-size: 14px;
            opacity: 0.8;
        }
        .fallback a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="message" id="message">正在跳转...</div>
        <div class="fallback" id="fallback" style="display: none;">
            如果没有自动跳转，请<a href="#" id="manualLink">点击这里</a>
        </div>
    </div>

    <script>
        (function() {
            // 获取 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type'); // 'register' 或 'login'
            const data = urlParams.get('data');

            if (!type || !data) {
                document.getElementById('message').textContent = '参数错误';
                return;
            }

            // 构建 App URL Scheme
            // 格式: poementer://github-callback?type=register&data=...
            const appScheme = `poementer://github-callback?type=${type}&data=${encodeURIComponent(data)}`;
            
            // 构建 H5 fallback URL
            const h5Url = type === 'register' 
                ? `/#/pages/register/register?fromGithub=true&githubData=${data}`
                : `/#/pages/poem-square/poem-square?githubLogin=success&loginData=${data}`;

            console.log('尝试跳转到 App:', appScheme);
            console.log('H5 fallback URL:', h5Url);

            // 尝试打开 App
            let openedApp = false;
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = appScheme;
            document.body.appendChild(iframe);

            // 设置超时，如果 App 没有打开，则跳转到 H5
            const timeout = setTimeout(function() {
                if (!openedApp) {
                    console.log('App 未打开，跳转到 H5');
                    document.getElementById('message').textContent = '正在跳转到网页版...';
                    window.location.href = h5Url;
                }
            }, 2000);

            // 监听页面可见性变化，如果页面隐藏说明 App 已打开
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    openedApp = true;
                    clearTimeout(timeout);
                    console.log('App 已打开');
                }
            });

            // 显示手动跳转链接
            setTimeout(function() {
                const fallback = document.getElementById('fallback');
                const manualLink = document.getElementById('manualLink');
                fallback.style.display = 'block';
                manualLink.href = h5Url;
            }, 3000);

            // iOS 特殊处理
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                // iOS 使用 window.location 可能更可靠
                window.location.href = appScheme;
                
                setTimeout(function() {
                    if (!openedApp) {
                        window.location.href = h5Url;
                    }
                }, 2500);
            }
        })();
    </script>
</body>
</html>
