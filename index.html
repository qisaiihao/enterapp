<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, initial-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <style>
      :root {
        --app-page-bg: #ffffff;
        --app-primary-text: #111111;
      }

      :root[data-app-theme="dark"] {
        --app-page-bg: #0f1115;
        --app-primary-text: #f4f1ea;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--app-page-bg, #ffffff);
        color: var(--app-primary-text, #111111);
      }

      body {
        min-height: 100%;
        overscroll-behavior-y: none;
      }

      #app {
        min-height: 100%;
        background: var(--app-page-bg, #ffffff);
      }

      uni-tabbar,
      uni-tabbar .uni-tabbar,
      uni-tabbar .uni-placeholder {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #app-loading-mask {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: var(--app-page-bg, #ffffff);
      }
    </style>
    <script>
      ;(function () {
        try {
          var mode = window.localStorage && window.localStorage.getItem('poementerThemeMode')
          if (mode === 'dark') {
            document.documentElement.setAttribute('data-app-theme', 'dark')
          }
        } catch (error) {}
      })()
    </script>
    <title></title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <div id="app-loading-mask"></div>
    <script>
      ;(function () {
        var isHidden = false
        function removeMask() {
          if (isHidden) {
            return
          }
          isHidden = true
          var mask = document.getElementById('app-loading-mask')
          if (mask && mask.parentNode) {
            mask.parentNode.removeChild(mask)
          }
        }

        function hideMask() {
          if (typeof window.requestAnimationFrame === 'function') {
            window.requestAnimationFrame(function () {
              window.requestAnimationFrame(removeMask)
            })
            return
          }
          window.setTimeout(removeMask, 0)
        }

        window.__ENTERAPP_HIDE_BOOT_MASK__ = hideMask
        window.addEventListener('enterapp-ready', hideMask)
        window.addEventListener('load', hideMask)
        window.setTimeout(hideMask, 4000)
      })()
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
