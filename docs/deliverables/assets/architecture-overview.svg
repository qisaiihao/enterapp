<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px SimSun, Songti SC, serif; fill: #173455; }
      .label { font: 600 24px SimSun, Songti SC, serif; fill: #173455; }
      .text { font: 22px SimSun, Songti SC, serif; fill: #1f2d3d; }
      .small { font: 20px SimSun, Songti SC, serif; fill: #32485f; }
      .box { fill: #f7fbff; stroke: #4f79a7; stroke-width: 3; rx: 20; ry: 20; }
      .group { fill: #ecf3fb; stroke: #2c5b8f; stroke-width: 4; rx: 28; ry: 28; }
      .arrow { stroke: #2c5b8f; stroke-width: 5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2c5b8f"/>
    </marker>
  </defs>

  <text x="800" y="64" text-anchor="middle" class="title">回车键Poementer软件总体架构图</text>

  <rect x="80" y="110" width="1440" height="180" class="group"/>
  <text x="800" y="150" text-anchor="middle" class="label">终端接入层</text>
  <rect x="170" y="185" width="260" height="70" class="box"/>
  <rect x="500" y="185" width="260" height="70" class="box"/>
  <rect x="830" y="185" width="260" height="70" class="box"/>
  <rect x="1160" y="185" width="260" height="70" class="box"/>
  <text x="300" y="228" text-anchor="middle" class="text">微信小程序</text>
  <text x="630" y="228" text-anchor="middle" class="text">H5 浏览器</text>
  <text x="960" y="228" text-anchor="middle" class="text">App 客户端</text>
  <text x="1290" y="228" text-anchor="middle" class="text">内容管理后台</text>

  <rect x="80" y="340" width="1440" height="220" class="group"/>
  <text x="800" y="380" text-anchor="middle" class="label">前端运行层（uni-app + Vue2）</text>
  <rect x="130" y="430" width="260" height="88" class="box"/>
  <rect x="460" y="430" width="260" height="88" class="box"/>
  <rect x="790" y="430" width="260" height="88" class="box"/>
  <rect x="1120" y="430" width="330" height="88" class="box"/>
  <text x="260" y="465" text-anchor="middle" class="text">页面与分包</text>
  <text x="260" y="496" text-anchor="middle" class="small">主包、用户、内容、工具、发布、活动</text>
  <text x="590" y="465" text-anchor="middle" class="text">组件与样式</text>
  <text x="590" y="496" text-anchor="middle" class="small">自定义 TabBar、内容组件、统一视觉规范</text>
  <text x="920" y="465" text-anchor="middle" class="text">API 与缓存层</text>
  <text x="920" y="496" text-anchor="middle" class="small">api-cache、LRU、TTL、SWR、事件失效</text>
  <text x="1285" y="465" text-anchor="middle" class="text">工具能力层</text>
  <text x="1285" y="496" text-anchor="middle" class="small">cloudCall、字体、图片、上传、导航、权限</text>

  <rect x="80" y="610" width="1440" height="220" class="group"/>
  <text x="800" y="650" text-anchor="middle" class="label">云服务层（CloudBase）</text>
  <rect x="130" y="700" width="320" height="88" class="box"/>
  <rect x="500" y="700" width="320" height="88" class="box"/>
  <rect x="870" y="700" width="320" height="88" class="box"/>
  <rect x="1240" y="700" width="220" height="88" class="box"/>
  <text x="290" y="735" text-anchor="middle" class="text">云函数服务群</text>
  <text x="290" y="766" text-anchor="middle" class="small">登录、发帖、搜索、活动、消息、关系链路</text>
  <text x="660" y="735" text-anchor="middle" class="text">云数据库</text>
  <text x="660" y="766" text-anchor="middle" class="small">users、posts、comments、messages 等集合</text>
  <text x="1030" y="735" text-anchor="middle" class="text">云存储与临时链接</text>
  <text x="1030" y="766" text-anchor="middle" class="small">头像、帖子图片、活动封面、字体与附件</text>
  <text x="1350" y="735" text-anchor="middle" class="text">运维与升级</text>
  <text x="1350" y="766" text-anchor="middle" class="small">配置、日志、热更新</text>

  <path d="M800 290 L800 335" class="arrow"/>
  <path d="M800 560 L800 605" class="arrow"/>
</svg>
